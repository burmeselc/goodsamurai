<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>World Chronicle</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--bg:#f5f4f0;--panel:#fff;--text:#171717;--muted:#6f6f69;--line:#dcdad2;--soft:#eceae3;--danger:#991b1b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:20;background:#f5f4f0ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(13px + env(safe-area-inset-top)) 16px 12px}header h1{margin:0;font-size:22px}main{max-width:980px;margin:auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#f5f4f0f5;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}button{border:1px solid var(--line);background:white;color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}button.primary{background:#111;color:#fff;border-color:#111}button.danger{color:var(--danger)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);padding:11px 12px;font-size:16px}textarea{min-height:95px}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}.card h2,.card h3{margin:0 0 6px}.meta{font-size:13px;color:var(--muted)}.row{display:flex;gap:10px}.row>*{flex:1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.hidden{display:none!important}.chip{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 8px;font-size:12px;margin:4px 4px 0 0}.section-title{font-size:18px;margin:22px 0 10px}.empty{padding:28px;text-align:center;color:var(--muted)}.yearbig{font-size:30px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:var(--soft);border-radius:12px;padding:10px}.stat strong{display:block;font-size:20px}.issue{border-left:4px solid #b26b00}.ok{border-left:4px solid #49744a}dialog{border:none;border-radius:16px;padding:0;max-width:680px;width:calc(100% - 24px)}dialog::backdrop{background:#0006}.dialog-inner{padding:16px;max-height:82vh;overflow:auto}.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}@media(max-width:650px){.row,.grid{display:block}.grid>.stat{margin-bottom:8px}.tabs button{font-size:12px;padding:9px 4px}}
</style></head><body><header><h1>World Chronicle</h1></header><main>
<section id="yearView"><div class="card"><div class="meta">WORLD AT YEAR</div><div class="row"><div id="yearLabel" class="yearbig">1950</div><div><input id="worldYear" type="number" value="1950" oninput="renderYear()"></div></div></div><div id="yearSummary"></div><h2 class="section-title">国家</h2><div id="yearStates"></div><h2 class="section-title">イベント</h2><div id="yearEvents"></div><h2 class="section-title">外交関係</h2><div id="yearRelations"></div></section>
<section id="dataView" class="hidden"><div class="toolbar"><button class="primary" onclick="openDialog()">＋ 追加</button></div><div class="card"><div class="row"><div><label>種類</label><select id="filterType" onchange="renderData()"><option value="">すべて</option><option value="state">国家</option><option value="region">地域</option><option value="person">人物</option><option value="event">イベント</option><option value="relation">外交関係</option></select></div><div><label>検索</label><input id="search" oninput="renderData()" placeholder="名称・説明・タグ"></div></div></div><div id="entityList"></div></section>
<section id="timelineView" class="hidden"><div class="card"><div class="row"><div><label>開始年</label><input id="tStart" type="number" value="1900" oninput="renderTimeline()"></div><div><label>終了年</label><input id="tEnd" type="number" value="2000" oninput="renderTimeline()"></div></div></div><div id="timelineList"></div></section>
<section id="checkView" class="hidden"><div class="toolbar"><button class="primary" onclick="renderChecks()">整合性チェック</button></div><div id="checkResults"></div></section>
<section id="exportView" class="hidden"><div class="card"><h3>バックアップ / 書き出し</h3><div class="toolbar"><button onclick="exportJSON()">JSON</button><button onclick="exportCSV()">CSV</button></div><label>JSONから復元</label><input type="file" accept=".json,application/json" onchange="importJSON(event)"></div><div class="card"><h3>保存状態</h3><div id="storageInfo" class="meta"></div></div></section>
</main><nav class="tabs"><button onclick="show('yearView')">Year</button><button onclick="show('dataView')">Data</button><button onclick="show('timelineView')">Timeline</button><button onclick="show('checkView')">Check</button><button onclick="show('exportView')">Export</button></nav>
<dialog id="dlg"><div class="dialog-inner"><h3 id="dlgTitle">追加</h3><input type="hidden" id="editId"><label>種類</label><select id="type" onchange="toggleFields()"><option value="state">国家</option><option value="region">地域</option><option value="person">人物</option><option value="event">イベント</option><option value="relation">外交関係</option></select><label>名称</label><input id="name"><div class="row"><div><label>開始年</label><input id="fromYear" type="number"></div><div><label>終了年</label><input id="toYear" type="number" placeholder="継続中なら空欄"></div></div>
<div id="stateFields"><label>首都</label><input id="capital"><label>政体</label><input id="government"><label>元首</label><input id="head"><label>公用語</label><input id="language"></div>
<div id="regionFields" class="hidden"><label>帰属国家</label><select id="regionState"></select><label>中心都市</label><input id="center"></div>
<div id="personFields" class="hidden"><label>出生年</label><input id="birth" type="number"><label>死亡年</label><input id="death" type="number"><label>所属国家</label><select id="personState"></select><label>役職</label><input id="role"></div>
<div id="eventFields" class="hidden"><label>イベント年</label><input id="eventYear" type="number"><label>関係国家</label><select id="eventState"></select></div>
<div id="relationFields" class="hidden"><label>国家A</label><select id="stateA"></select><label>国家B</label><select id="stateB"></select><label>関係</label><select id="relationType"><option>同盟</option><option>友好</option><option>中立</option><option>対立</option><option>戦争</option><option>保護国</option><option>属国</option><option>通商</option></select></div>
<label>説明 / 備考</label><textarea id="desc"></textarea><label>タグ（カンマ区切り）</label><input id="tags"><div class="dialog-actions"><button onclick="dlg.close()">キャンセル</button><button class="primary" onclick="saveEntity()">保存</button></div></div></dialog>
<script>
const KEY='worldChronicle.v1';let db=load();function fresh(){return{states:[],regions:[],persons:[],events:[],relations:[],updatedAt:null}}function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}function save(){db.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db));renderCurrent()}function uid(p){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function tg(v){return v.split(',').map(x=>x.trim()).filter(Boolean)}function active(x,y){let f=Number(x.fromYear),t=x.toYear===''||x.toYear==null?Infinity:Number(x.toYear);return y>=f&&y<=t}function state(id){return db.states.find(x=>x.id===id)}function coll(t){return({state:db.states,region:db.regions,person:db.persons,event:db.events,relation:db.relations})[t]}function label(t){return({state:'国家',region:'地域',person:'人物',event:'イベント',relation:'外交関係'})[t]}function all(){return[...db.states.map(x=>({...x,_type:'state'})),...db.regions.map(x=>({...x,_type:'region'})),...db.persons.map(x=>({...x,_type:'person'})),...db.events.map(x=>({...x,_type:'event'})),...db.relations.map(x=>({...x,_type:'relation'}))]}function eName(e){return e._type==='relation'?`${state(e.stateA)?.name||'?'} ↔ ${state(e.stateB)?.name||'?'}`:(e.name||'(無名)')}
function show(id){['yearView','dataView','timelineView','checkView','exportView'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='yearView')renderYear();if(id==='dataView')renderData();if(id==='timelineView')renderTimeline();if(id==='checkView')renderChecks();if(id==='exportView')renderStorage()}
function renderYear(){let y=Number(worldYear.value)||0;yearLabel.textContent=y;let ss=db.states.filter(x=>active(x,y)),rs=db.regions.filter(x=>active(x,y)),ps=db.persons.filter(x=>active(x,y)),es=db.events.filter(x=>Number(x.eventYear)===y),rels=db.relations.filter(x=>active(x,y));yearSummary.innerHTML=`<div class="grid"><div class="stat"><strong>${ss.length}</strong><span class="meta">国家</span></div><div class="stat"><strong>${rs.length}</strong><span class="meta">地域</span></div><div class="stat"><strong>${ps.length}</strong><span class="meta">人物</span></div><div class="stat"><strong>${es.length}</strong><span class="meta">イベント</span></div></div>`;yearStates.innerHTML=ss.length?ss.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><div class="meta">${s.fromYear}–${s.toYear||'存続'}${s.government?' · '+esc(s.government):''}</div>${s.capital?`<div>首都：${esc(s.capital)}</div>`:''}${s.head?`<div>元首：${esc(s.head)}</div>`:''}${s.language?`<div>公用語：${esc(s.language)}</div>`:''}${s.description?`<p>${esc(s.description)}</p>`:''}</div>`).join(''):'<div class="empty">国家なし</div>';yearEvents.innerHTML=es.length?es.map(e=>`<div class="card"><h3>${esc(e.name)}</h3><div class="meta">${e.eventYear}${e.stateId?' · '+esc(state(e.stateId)?.name||''):''}</div>${e.description?`<p>${esc(e.description)}</p>`:''}</div>`).join(''):'<div class="empty">イベントなし</div>';yearRelations.innerHTML=rels.length?rels.map(r=>`<div class="card"><h3>${esc(state(r.stateA)?.name||'?')} ↔ ${esc(state(r.stateB)?.name||'?')}</h3><div class="meta">${esc(r.relationType)} · ${r.fromYear}–${r.toYear||'継続'}</div>${r.description?`<p>${esc(r.description)}</p>`:''}</div>`).join(''):'<div class="empty">外交関係なし</div>'}
function populate(){let o='<option value="">—</option>'+db.states.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');['regionState','personState','eventState','stateA','stateB'].forEach(id=>document.getElementById(id).innerHTML=o)}function reset(){['name','fromYear','toYear','capital','government','head','language','center','birth','death','role','eventYear','desc','tags'].forEach(id=>document.getElementById(id).value='');['regionState','personState','eventState','stateA','stateB'].forEach(id=>document.getElementById(id).value='');relationType.value='同盟'}function openDialog(t='state',id=''){populate();reset();editId.value=id;type.value=t;dlgTitle.textContent=id?'編集':'追加';if(id){let e=coll(t).find(x=>x.id===id);name.value=e.name||'';fromYear.value=e.fromYear??'';toYear.value=e.toYear??'';desc.value=e.description||'';tags.value=(e.tags||[]).join(', ');if(t==='state'){capital.value=e.capital||'';government.value=e.government||'';head.value=e.head||'';language.value=e.language||''}if(t==='region'){regionState.value=e.stateId||'';center.value=e.center||''}if(t==='person'){birth.value=e.birthYear??'';death.value=e.deathYear??'';personState.value=e.stateId||'';role.value=e.role||''}if(t==='event'){eventYear.value=e.eventYear??'';eventState.value=e.stateId||''}if(t==='relation'){stateA.value=e.stateA||'';stateB.value=e.stateB||'';relationType.value=e.relationType||'同盟'}}toggleFields();dlg.showModal()}function toggleFields(){['stateFields','regionFields','personFields','eventFields','relationFields'].forEach(id=>document.getElementById(id).classList.add('hidden'));document.getElementById(type.value+'Fields').classList.remove('hidden')}
function saveEntity(){let t=type.value;if(t!=='relation'&&!name.value.trim()){alert('名称は必須です');return}if(t==='event'&&!eventYear.value){alert('イベント年は必須です');return}if(t!=='event'&&!fromYear.value){alert('開始年は必須です');return}let id=editId.value||uid(t),obj={id,name:name.value.trim(),fromYear:t==='event'?Number(eventYear.value):Number(fromYear.value),toYear:t==='event'?Number(eventYear.value):(toYear.value===''?'':Number(toYear.value)),description:desc.value.trim(),tags:tg(tags.value)};if(t==='state')Object.assign(obj,{capital:capital.value.trim(),government:government.value.trim(),head:head.value.trim(),language:language.value.trim()});if(t==='region')Object.assign(obj,{stateId:regionState.value,center:center.value.trim()});if(t==='person')Object.assign(obj,{birthYear:birth.value===''?'':Number(birth.value),deathYear:death.value===''?'':Number(death.value),stateId:personState.value,role:role.value.trim()});if(t==='event')Object.assign(obj,{eventYear:Number(eventYear.value),stateId:eventState.value});if(t==='relation')Object.assign(obj,{stateA:stateA.value,stateB:stateB.value,relationType:relationType.value});let c=coll(t),i=c.findIndex(x=>x.id===id);i>=0?c[i]=obj:c.push(obj);dlg.close();save()}function del(t,id){if(!confirm('削除しますか？'))return;let c=coll(t),i=c.findIndex(x=>x.id===id);if(i>=0)c.splice(i,1);save()}
function renderData(){let t=filterType.value,q=(search.value||'').toLowerCase(),list=all().filter(e=>(!t||e._type===t)&&[eName(e),e.description,(e.tags||[]).join(' '),e.government,e.role,e.relationType].join(' ').toLowerCase().includes(q));list.sort((a,b)=>(Number(a.fromYear)||0)-(Number(b.fromYear)||0)||eName(a).localeCompare(eName(b),'ja'));entityList.innerHTML=list.length?list.map(e=>`<div class="card"><div class="meta">${label(e._type)} · ${e._type==='event'?e.eventYear:`${e.fromYear}–${e.toYear||'継続'}`}${e._type==='relation'?' · '+esc(e.relationType):''}</div><h3>${esc(eName(e))}</h3>${e.description?`<p>${esc(e.description)}</p>`:''}<div>${(e.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><div class="toolbar" style="margin-top:10px"><button onclick="openDialog('${e._type}','${e.id}')">編集</button><button class="danger" onclick="del('${e._type}','${e.id}')">削除</button></div></div>`).join(''):'<div class="empty">データなし</div>'}
function renderTimeline(){let a=Number(tStart.value)||-99999,b=Number(tEnd.value)||99999,list=all().filter(e=>{let y=Number(e._type==='event'?e.eventYear:e.fromYear);return y>=a&&y<=b}).sort((x,y)=>Number(x._type==='event'?x.eventYear:x.fromYear)-Number(y._type==='event'?y.eventYear:y.fromYear));timelineList.innerHTML=list.length?list.map(e=>`<div class="card"><div class="meta">${label(e._type)}</div><h3>${e._type==='event'?e.eventYear:e.fromYear} — ${esc(eName(e))}</h3>${e.description?`<p>${esc(e.description)}</p>`:''}</div>`).join(''):'<div class="empty">範囲内データなし</div>'}
function renderChecks(){let issues=[];all().forEach(e=>{if(e._type!=='event'&&e.toYear!==''&&Number(e.toYear)<Number(e.fromYear))issues.push(`${label(e._type)}「${eName(e)}」の終了年が開始年より前です。`)});db.persons.forEach(p=>{if(p.birthYear!==''&&p.deathYear!==''&&Number(p.deathYear)<Number(p.birthYear))issues.push(`人物「${p.name}」の死亡年が出生年より前です。`);if(p.birthYear!==''&&Number(p.fromYear)<Number(p.birthYear))issues.push(`人物「${p.name}」の活動開始年が出生年より前です。`);if(p.deathYear!==''&&(p.toYear===''?Infinity:Number(p.toYear))>Number(p.deathYear))issues.push(`人物「${p.name}」の活動期間が死亡年を越えています。`)});db.relations.forEach(r=>{if(!r.stateA||!r.stateB)issues.push('外交関係に国家A/Bの未設定があります。');if(r.stateA&&r.stateA===r.stateB)issues.push('外交関係が同一国家同士です。');[r.stateA,r.stateB].forEach(id=>{let s=state(id);if(!s)return;let rf=Number(r.fromYear),rt=r.toYear===''?Infinity:Number(r.toYear),sf=Number(s.fromYear),st=s.toYear===''?Infinity:Number(s.toYear);if(rf<sf||rt>st)issues.push(`外交関係「${eName({...r,_type:'relation'})}」が国家「${s.name}」の存続期間外にはみ出しています。`)})});db.events.forEach(e=>{if(e.stateId){let s=state(e.stateId);if(s&&!active(s,Number(e.eventYear)))issues.push(`イベント「${e.name}」の年には関係国家「${s.name}」が存在していません。`)}});checkResults.innerHTML=issues.length?issues.map(x=>`<div class="card issue">${esc(x)}</div>`).join(''):'<div class="card ok"><strong>重大な整合性エラーは検出されませんでした。</strong><div class="meta">MVPで検査できる範囲です。</div></div>'}
function download(n,t,ty){let b=new Blob([t],{type:ty}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportJSON(){download(`world-chronicle-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(db,null,2),'application/json')}function csv(v){let s=String(v??'');return `"${s.replaceAll('"','""')}"`}function exportCSV(){let rows=[['type','name','from_year','to_year','description','tags','extra']];all().forEach(e=>{let x='';if(e._type==='state')x=`capital=${e.capital||''}; government=${e.government||''}; head=${e.head||''}; language=${e.language||''}`;if(e._type==='region')x=`state=${state(e.stateId)?.name||''}; center=${e.center||''}`;if(e._type==='person')x=`birth=${e.birthYear||''}; death=${e.deathYear||''}; state=${state(e.stateId)?.name||''}; role=${e.role||''}`;if(e._type==='event')x=`year=${e.eventYear}; state=${state(e.stateId)?.name||''}`;if(e._type==='relation')x=`A=${state(e.stateA)?.name||''}; B=${state(e.stateB)?.name||''}; relation=${e.relationType}`;rows.push([e._type,eName(e),e.fromYear,e.toYear,e.description,(e.tags||[]).join(';'),x])});download(`world-chronicle-${new Date().toISOString().slice(0,10)}.csv`,'\uFEFF'+rows.map(r=>r.map(csv).join(',')).join('\n'),'text/csv')}function importJSON(ev){let f=ev.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.states||!x.regions||!x.persons||!x.events||!x.relations)throw 0;if(confirm('現在のデータを置き換えますか？')){db=x;save();show('yearView')}}catch(e){alert('有効なWorld Chronicle JSONではありません')}};r.readAsText(f)}function renderStorage(){let bytes=new Blob([JSON.stringify(db)]).size;storageInfo.innerHTML=`最終更新：${db.updatedAt?new Date(db.updatedAt).toLocaleString('ja-JP'):'未保存'}<br>データサイズ：約 ${(bytes/1024).toFixed(1)} KB`}function renderCurrent(){if(!yearView.classList.contains('hidden'))renderYear();if(!dataView.classList.contains('hidden'))renderData();if(!timelineView.classList.contains('hidden'))renderTimeline();if(!checkView.classList.contains('hidden'))renderChecks();if(!exportView.classList.contains('hidden'))renderStorage()}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});renderYear();
</script></body></html>
