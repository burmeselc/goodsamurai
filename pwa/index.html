<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f0e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="日録" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
  <link rel="stylesheet" href="./style.css" />
  <title>日録</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LOCAL JOURNAL</div>
        <h1 id="dateTitle">今日</h1>
      </div>
      <button id="settingsButton" class="icon-button" aria-label="設定">⚙︎</button>
    </header>

    <section class="date-nav" aria-label="日付移動">
      <button id="prevDay" class="quiet-button">← 前日</button>
      <input id="datePicker" type="date" aria-label="日付を選択" />
      <button id="todayButton" class="quiet-button">今日</button>
      <button id="nextDay" class="quiet-button">翌日 →</button>
    </section>

    <main>
      <section id="memoList" class="memo-list" aria-live="polite"></section>
      <div id="emptyState" class="empty-state">
        まだ記録がありません。<br />
        おもひついたことを下から書いてみませう。
      </div>
    </main>

    <footer class="composer-wrap">
      <div class="composer-card">
        <textarea id="composer" rows="3" placeholder="いまおもふこと……" aria-label="新しい記録"></textarea>
        <div class="composer-actions">
          <span id="draftStatus" class="draft-status">下書き自動保存</span>
          <button id="submitMemo" class="primary-button">記録</button>
        </div>
      </div>
    </footer>
  </div>

  <dialog id="editDialog">
    <form method="dialog" class="dialog-card">
      <h2>記録を編集</h2>
      <textarea id="editText" rows="8"></textarea>
      <div class="dialog-actions split">
        <button type="button" id="deleteMemo" class="danger-button">削除</button>
        <div>
          <button value="cancel" class="quiet-button">取消</button>
          <button type="button" id="saveEdit" class="primary-button">保存</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card settings-card">
      <h2>設定・保存</h2>

      <section class="settings-section">
        <h3>データ</h3>
        <p>記録本文はこの端末のブラウザー内に保存されます。</p>
        <div class="stack-actions">
          <button type="button" id="exportJson" class="secondary-button">JSONを書き出す</button>
          <label class="file-button">
            JSONを読み込む
            <input type="file" id="importJson" accept="application/json,.json" />
          </label>
        </div>
      </section>

      <section class="settings-section">
        <h3>保存領域</h3>
        <p id="persistStatus">確認中……</p>
        <button type="button" id="requestPersist" class="secondary-button">永続保存を要求</button>
      </section>

      <section class="settings-section">
        <h3>表示</h3>
        <label class="toggle-row">
          <span>本文を少し大きくする</span>
          <input type="checkbox" id="largeTextToggle" />
        </label>
      </section>

      <div class="dialog-actions">
        <button value="close" class="primary-button">閉ぢる</button>
      </div>
    </form>
  </dialog>

  <script src="./db.js"></script>
  <script src="./app.js"></script>
</body>
</html>
